<header class="topbar">
  <a class="brand" routerLink="/">GALATECH</a>
  <nav class="top-nav">
    @if (auth.user()) {
      <a routerLink="/panel">Panel</a>
      <a routerLink="/reparaciones">Reparaciones</a>
      <span class="user-name">{{ auth.user()?.role === 'ADMIN' ? 'Administrador' : auth.user()?.name }}</span>
      <button class="sign-out" (click)="logout()">Cerrar sesión</button>
    } @else {
      <a routerLink="/seguimiento">Consultar reparación</a>
      <a class="staff-access" routerLink="/login">Acceso del personal</a>
    }
  </nav>
</header>
<router-outlet />
<footer class="footer"><span>GALATECH</span><span>Seguimiento y gestión de reparaciones</span></footer>
